name: LinkedIn Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Publish LinkedIn post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: "202603"
        run: python linkedin_bot.py

      - name: Save publication status
        run: |
          git config user.name "LinkedIn Bot"
          git config user.email "actions@github.com"
          git add content.json
          git diff --cached --quiet || git commit -m "Update LinkedIn publication status"
          git push
